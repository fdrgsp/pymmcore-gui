name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:

jobs:
  check-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pipx run check-manifest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --verbose

  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    # windows-latest py3.13PySide6 hits a reproducible-but-harmless crash
    # (exit 0xC0000409 / __fastfail) *after* pytest's own clean "N passed"
    # summary. A procdump-captured minidump showed only one thread left
    # alive, with every application/Qt/PySide6/Python-interpreter module
    # already unloaded -- just python.exe's launcher stub, ntdll, kernel32,
    # and the CRT remained. That's the OS loader's own final process
    # teardown, well past anything this project's code (or even CPython's
    # normal shutdown path) still controls, so it's treated as non-blocking
    # rather than chased further.
    continue-on-error: ${{ matrix.qt == 'PySide6' }}
    env:
      UV_FROZEN: 1
      UV_NO_SYNC: 1
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
        qt: [""]
        include:
          - os: windows-latest
            python-version: "3.13"
            qt: "PySide6"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true

      - name: Install
        shell: bash
        run: |
          if [[ "${{ matrix.qt }}" == "PySide6" ]]; then
            uv sync --group PySide6 --no-install-package PyQt6 --no-install-package PyQt6Ads
          else
            uv sync
          fi

      - uses: pymmcore-plus/setup-mm-test-adapters@main

      - name: Test
        run: uv run coverage run -p -m pytest -v --color=yes

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: covreport-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.qt }}
          path: ./.coverage*
          include-hidden-files: true

  upload_coverage:
    if: always()
    needs: [test]
    uses: pyapp-kit/workflows/.github/workflows/upload-coverage.yml@v2
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
